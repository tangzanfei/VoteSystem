<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://apps.bdimg.com/libs/jquerymobile/1.4.5/jquery.mobile-1.4.5.min.css">
    <script src="https://apps.bdimg.com/libs/jquery/1.10.2/jquery.min.js"></script>
    <script src="https://apps.bdimg.com/libs/jquerymobile/1.4.5/jquery.mobile-1.4.5.min.js"></script>
    <script src="https://cdn.bootcss.com/jquery-cookie/1.4.1/jquery.cookie.js"></script>//这句很重要，且位置必须放在js的引入之后
    <script>
        $(function () {
            $("#login").click(function () {
                var s = $("#ID").val();
                //save()
                $.ajax({
                    type: 'POST',
                    url: 'LoginHandler.ashx',
                    data: { ID: s },
                    success: function (data) {
                        switch (data) {
                            case "ok": {
                                window.location = "VotePage.html";
                                break;
                            }
                            case "admin": {
                                window.location = "Admin.html";
                                break;
                            }
                            default: {
                                alert(data);
                            }
                        }
                    }, error: function () {

                    }
                })
            })
        })

        $(document).ready(function () {
            var rem = $.cookie('rmbUser');
            if (rem == "true") {
                $("#ck_rmbUser").prop("checked", true).checkboxradio("refresh");;
                $("#ID").val($.cookie("username"));
                //$("#password").remove();
                //$("#pass").append("<input id='password' type='password' class='txt2'/>");
                //$("#password").val($.cookie("password"));
            }

            // 获取传递的编号
            var id = getUrlParam("id");
            if (id) {
                $("#ID").val(id);

            }
        });


        //记住用户名密码
        function save() {
            if ($("#ck_rmbUser").prop("checked")) {
                var username = $("#ID").val();
                //var password = $("#password").val();
                $.cookie("rmbUser", "true", { expires: 7 }); //存储一个带7天期限的cookie
                $.cookie("username", username, { expires: 7 });
                //$.cookie("password", password, { expires: 7 });
            } else {
                $.cookie("rmbUser", "false", { expire: -1 });
                $.cookie("username", "", { expires: -1 });
                //$.cookie("password", "", { expires: -1 });
            }
        };





        // 从url中获取参数，使用正则表达式
        function getUrlParam(name) {
            //构造一个含有目标参数的正则表达式对象
            var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)");
            //匹配目标参数
            var r = window.location.search.substr(1).match(reg);
            //返回参数
            if (r != null) {
                return unescape(r[2]);
            }
            return null;
        }
    </script>
    <style>
        img {
            
            width: 30%;
            height: auto;
        }
    </style>
</head>
<body>
    <div data-role="page">
        <div data-role="header">
            <h1>专题询问满意度测评</h1>
        </div>
        <div data-role="main" class="ui-content">
            <div>
                <h3>  </h3>
            </div>

            <div align="center" width="10" height="10" >
                <img src="../Images/logo.png" />
            </div>
            <div><h3 align="center">桂阳县行政审批和许可提速工作</h3></div>
            <div><h3 align="center">专题询问满意度测评</h3></div>

            <form method="post">
                <label for="ID">评委授权码：</label>
                <input type="text" name="ID" id="ID">
                <!--<label for="ck_rmbUser">记住我</label>
        <input type="checkbox" name="favcolor" id="ck_rmbUser" value="false">-->
                <a href="#" id="login" class="ui-btn ui-btn-b">登  录</a>

            </form>
        </div>
    </div>
</body>
</html>
